# The whole system on one machine: `docker compose -f deploy/docker-compose.yml up --build`
#   API:        http://localhost:8080   (OpenAPI at /openapi/v1.json)
#   Dashboard:  http://localhost:18888  (traces, metrics and logs from API and workers)
#   Postgres:   localhost:55432, Kafka: localhost:29092 (for tools on the host)
name: unified-service-scheduler

x-app-env: &app-env
  # GSS encryption off: the slim runtime image has no Kerberos library, and nothing here uses it.
  ConnectionStrings__Scheduler: Host=postgres;Database=scheduler;Username=scheduler;Password=scheduler;Gss Encryption Mode=Disable
  Kafka__BootstrapServers: kafka:9092
  OTEL_EXPORTER_OTLP_ENDPOINT: http://dashboard:18889
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc

x-api-build: &api-build
  context: ..
  dockerfile: deploy/Dockerfile
  args: { PROJECT: Scheduler.Api }

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: scheduler
    ports: ["55432:5432"]   # 55432 on the host, so it never collides with a local Postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 2s
      retries: 30

  kafka:
    # Single-node Apache Kafka in KRaft mode (no ZooKeeper). Same image as the integration tests.
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports: ["29092:29092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 3s
      retries: 40

  migrate:
    # One-shot: apply EF Core migrations and the demo reference data, then exit.
    build: *api-build
    image: unified-service-scheduler/api
    command: ["--migrate", "--seed"]
    environment: *app-env
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: *api-build
    image: unified-service-scheduler/api
    environment: *app-env
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: { PROJECT: Scheduler.Worker }
    image: unified-service-scheduler/worker
    environment: *app-env
    deploy:
      replicas: 2   # partitions are shared between them; stop one to watch its partitions move
    depends_on:
      migrate: { condition: service_completed_successfully }
      kafka: { condition: service_healthy }

  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports: ["18888:18888"]
