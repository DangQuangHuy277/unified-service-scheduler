<text font-size="14" fill="#495057" text-anchor="start"><tspan x="140.0" y="813.3">API, workers, relay and projector export traces, metrics and logs over OTLP (the Aspire dashboard in docker compose).</tspan><tspan x="140.0" y="830.8">One trace runs from POST /appointments through the Kafka publish to the worker's booking decision.</tspan></text>
