<rect x="507.1" y="249.2" width="65.9" height="21.5" rx="4" fill="#ffffff"/>
<text font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" y="264.6">produce</tspan></text>
<text font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="550.0" y="478.8">Booking worker ×M: one owner per partition</tspan><tspan x="550.0" y="497.5">fence epoch → skip decided ids →</tspan><tspan x="550.0" y="516.2">decide in memory (DealershipSchedule)</tspan><tspan x="550.0" y="535.0">one transaction per batch (≤ 64)</tspan></text>
<rect x="480.1" y="396.2" width="119.8" height="21.5" rx="4" fill="#ffffff"/>
<text font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" y="411.6">consumer group</tspan></text>
