<text font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" y="17.2">Client</tspan><tspan x="540.0" y="37.2">OpenAPI · Scheduler.http · cURL</tspan></text>
<text font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="540.0" y="146.8">ASP.NET Core API ×N  (controllers)</tspan><tspan x="540.0" y="165.5">validate against cached reference data</tspan><tspan x="540.0" y="184.2">register waiter → produce → wait ≤ 2 s</tspan><tspan x="540.0" y="203.0">GET /availability reads the read model</tspan></text>
